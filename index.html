  /* Estilo inspirado en la página de hospedaje: verde profundo, dorado y crema */
  :root { --bg:#f7f5ef; --surface:#ffffff; --text:#172019; --muted:#667168; --accent:#16452a; --accent-2:#23643d; --accent-soft:#f4ead0; --border:#e4e7e1; --shadow:0 16px 45px rgba(20,48,31,.10); --gold:#c8a34b; }
  body { font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); }
  .barra-pub { background:rgba(15,50,30,.96); backdrop-filter:blur(12px); border-bottom:1px solid rgba(255,255,255,.10); }
  .barra-pub button.on { background:var(--gold); color:#1c170b; border-color:var(--gold); }
  header { background:linear-gradient(120deg,#0f321e 0%,#23643d 100%); border-radius:24px; padding:44px 40px; box-shadow:var(--shadow); }
  header h1 { font-size:clamp(2.2rem,5vw,3.6rem); letter-spacing:-.04em; line-height:1.02; }
  header p { color:#e2eee5; }
  header:before { content:"Directorio oficial"; display:inline-block; margin-bottom:16px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); padding:7px 13px; border-radius:999px; font-size:.85rem; font-weight:700; }
  .stats { background:var(--accent-2); border-radius:18px; padding:0; gap:0; overflow:hidden; box-shadow:var(--shadow); }
  .stat { background:transparent; border:0; border-right:1px solid rgba(255,255,255,.12); border-radius:0; color:#d9e9dd; padding:18px 20px; }
  .stat:last-child { border-right:0; }
  .stat b { color:#fff; font-size:1.5rem; }
  .buscador { border-radius:14px; border-color:var(--border); box-shadow:0 6px 18px rgba(20,48,31,.06); }
  .card { border-radius:22px; border-color:var(--border); box-shadow:0 6px 18px rgba(20,48,31,.05); }
  .card:before { background:var(--gold); }
  .card:hover, .card:focus-visible { box-shadow:var(--shadow); border-color:#c9d6c9; }
  .card h2, .titulo, .ie-info h2 { color:var(--accent); letter-spacing:-.02em; }

  .ie-card { border-radius:22px; }

/* ================= REDISEÑO V2 · PÁGINA PÚBLICA ================= */
:root{
  --verde-prof:#06281a; --verde:#0e7a4b; --verde-vivo:#18c07a; --turquesa:#14b8c6;
  --dorado:#ffc531; --naranja:#ff7a3d; --magenta:#e8467c;
  --bg:#eef6f1; --accent:#0b5c3a; --accent-2:#0e8f58; --gold:#ffc531;
  --grad-vivo:linear-gradient(120deg,#0e7a4b 0%,#14b8c6 55%,#ffc531 130%);
}
body{ background:
  radial-gradient(1000px 500px at 100% -10%, rgba(20,184,198,.14), transparent 60%),
  radial-gradient(900px 500px at -10% 30%, rgba(255,197,49,.16), transparent 60%),
  #eef6f1 !important; }

/* Barra superior */
.barra-pub{ background:linear-gradient(90deg,#06281a,#0b5c3a 60%,#0e7a4b) !important; border-bottom:2px solid var(--dorado) !important; }
.marca-pub{ background:linear-gradient(90deg,#ffc531,#ff7a3d); -webkit-background-clip:text; background-clip:text; color:transparent !important; font-size:1.05rem; }
.barra-pub button{ transition:all .25s ease; }
.barra-pub button:hover{ transform:translateY(-2px); background:rgba(255,255,255,.22) !important; }
.barra-pub button.on{ background:linear-gradient(90deg,#ffc531,#ff9a3d) !important; box-shadow:0 4px 14px rgba(255,197,49,.45); }
.btn-usuarios{ background:linear-gradient(90deg,#ff7a3d,#e8467c) !important; color:#fff !important; }

/* Portada con imagen de fondo */
header.portada{ min-height:600px !important; background:#06281a !important; }
.portada-fondo{
  background-image:url('https://i.ibb.co/Fkdvk6PQ/Gemini-Generated-Image-6z2twb6z2twb6z2t.jpg');
  background-size:cover !important; background-position:center !important;
  animation:zoomFondo 24s ease-in-out infinite alternate;
}
.portada-velo{
  background:linear-gradient(100deg,rgba(6,40,26,.92) 0%,rgba(6,40,26,.55) 55%,rgba(14,122,75,.25) 100%) !important;
  opacity:1 !important;
}
header.portada:after{ content:""; position:absolute; left:0; right:0; bottom:0; height:6px; background:linear-gradient(90deg,#ffc531,#ff7a3d,#e8467c,#14b8c6,#18c07a); background-size:200% 100%; animation:franja 6s linear infinite; }
@keyframes zoomFondo{ from{transform:scale(1)} to{transform:scale(1.1)} }
@keyframes franja{ to{ background-position:200% 0 } }
.portada-contenido > *{ animation:subir .8s cubic-bezier(.2,.8,.2,1) both; }
.portada-contenido > *:nth-child(1){animation-delay:.05s}
.portada-contenido > *:nth-child(2){animation-delay:.2s}
.portada-contenido > *:nth-child(3){animation-delay:.35s}
.portada-contenido > *:nth-child(4){animation-delay:.5s}
.portada-contenido > *:nth-child(5){animation-delay:.65s}
@keyframes subir{ from{opacity:0; transform:translateY(34px)} to{opacity:1; transform:none} }
.logo-ugel{ animation:flotar 5s ease-in-out infinite, subir .8s both !important; }
@keyframes flotar{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
header.portada h1{ text-shadow:0 4px 24px rgba(0,0,0,.45); }
header.portada h1{ background:linear-gradient(90deg,#fff 30%,#ffe29a); -webkit-background-clip:text; background-clip:text; color:transparent !important; }
.portada-contenido .eyebrow{ background:linear-gradient(90deg,rgba(255,197,49,.28),rgba(20,184,198,.28)) !important; border-color:rgba(255,197,49,.5) !important; }
.btn-p1{ background:linear-gradient(90deg,#ffc531,#ff9a3d) !important; box-shadow:0 8px 24px rgba(255,154,61,.5); transition:transform .25s, box-shadow .25s; }
.btn-p2{ backdrop-filter:blur(6px); transition:transform .25s, background .25s; }
.botones-portada button:hover{ transform:translateY(-4px) scale(1.04); }
.btn-p1{ animation:pulso 2.6s ease-in-out infinite; }

/* Estadísticas */
.stats{ background:var(--grad-vivo) !important; border-radius:20px !important; box-shadow:0 14px 34px rgba(14,122,75,.3) !important; animation:subir .7s both; }
.stat{ color:#e9fff3 !important; transition:transform .25s, background .25s; }
.stat:hover{ background:rgba(255,255,255,.14) !important; transform:scale(1.04); }
.stat b{ font-size:1.9rem !important; text-shadow:0 2px 8px rgba(0,0,0,.2); }

/* Botones de acción */
.ver-mapa{ background:linear-gradient(90deg,#0e7a4b,#14b8c6) !important; box-shadow:0 6px 18px rgba(20,184,198,.4); transition:transform .25s, box-shadow .25s; }
.ver-mapa:hover{ transform:translateY(-3px); box-shadow:0 10px 24px rgba(20,184,198,.55); }
.kicker-pub{ color:#e8467c !important; }
.sec-pub{ background:linear-gradient(90deg,#0b5c3a,#14b8c6); -webkit-background-clip:text; background-clip:text; color:transparent !important; }
.buscador{ border:2px solid #bfe6d2 !important; transition:all .25s; }
.buscador:focus{ border-color:#14b8c6 !important; box-shadow:0 0 0 5px rgba(20,184,198,.2) !important; transform:scale(1.01); }

/* Tarjetas de distrito: cuadrícula ordenada, colores rotativos */
.grid-d{ grid-template-columns:repeat(auto-fill,minmax(230px,1fr)) !important; gap:20px !important; }
.card{ overflow:hidden; border:none !important; box-shadow:0 8px 22px rgba(6,40,26,.1) !important; animation:aparecer .6s cubic-bezier(.2,.8,.2,1) both; transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s !important; }
.card:before{ width:100% !important; height:7px !important; border-radius:0 !important; margin:-21px -21px 16px !important; width:calc(100% + 42px) !important; background:linear-gradient(90deg,#0e7a4b,#18c07a) !important; }
.grid-d .card:nth-child(4n+1):before{ background:linear-gradient(90deg,#0e7a4b,#18c07a) !important; }
.grid-d .card:nth-child(4n+2):before{ background:linear-gradient(90deg,#14b8c6,#3b82f6) !important; }
.grid-d .card:nth-child(4n+3):before{ background:linear-gradient(90deg,#ffc531,#ff7a3d) !important; }
.grid-d .card:nth-child(4n+4):before{ background:linear-gradient(90deg,#e8467c,#a855f7) !important; }
.card:hover,.card:focus-visible{ transform:translateY(-8px) rotate(-.6deg) !important; box-shadow:0 18px 38px rgba(14,122,75,.25) !important; }
.card .abre{ transition:transform .25s; }
.card:hover .abre{ transform:translateX(8px); }
.card h2{ font-size:1.3rem !important; }
@keyframes aparecer{ from{opacity:0; transform:translateY(28px) scale(.96)} to{opacity:1; transform:none} }
.grid-d .card:nth-child(1){animation-delay:.03s}.grid-d .card:nth-child(2){animation-delay:.08s}.grid-d .card:nth-child(3){animation-delay:.13s}
.grid-d .card:nth-child(4){animation-delay:.18s}.grid-d .card:nth-child(5){animation-delay:.23s}.grid-d .card:nth-child(6){animation-delay:.28s}
.grid-d .card:nth-child(7){animation-delay:.33s}.grid-d .card:nth-child(8){animation-delay:.38s}.grid-d .card:nth-child(n+9){animation-delay:.43s}

  .card { position:relative; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:21px; cursor:pointer; color:inherit; font:inherit; text-align:left; width:100%; min-height:145px; transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease; }
  .card:before { content:""; display:block; width:34px; height:4px; background:#3e83b9; border-radius:4px; margin-bottom:15px; }
  .card:hover,.card:focus-visible { transform:translateY(-3px); box-shadow:var(--shadow); border-color:#9abbd7; outline:none; }

  .ie-card { display:grid; grid-template-columns:1fr 1fr; padding:0; min-height:150px; overflow:hidden; }

  .tabla-nominal th, .tabla-nominal td { padding:13px 16px; text-align:left; vertical-align:top; border-bottom:1px solid var(--border); }
  .tabla-nominal th { position:sticky; top:0; background:#f6f9fc; color:var(--accent-2); font-weight:700; z-index:1; white-space:nowrap; }
  .tabla-nominal td { line-height:1.4; }
  .tabla-nominal td:nth-child(3) { min-width:240px; font-weight:600; }
  .tabla-nominal td:nth-child(1), .tabla-nominal td:nth-child(2) { white-space:nowrap; font-variant-numeric:tabular-nums; }
  .tabla-nominal tr[hidden] { display:none; }

  @media(max-width:640px) { .nominal-buscar { min-width:0; width:100%; flex:1 1 100%; } }
  .nominal-cat { font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 14px; min-width:200px; }
  /* Tabla nominal más alta: se ven más filas sin desplazarse dentro de la tabla */
  .tabla-nominal { max-height:88vh; min-height:60vh; }
  @media(max-width:640px) { .tabla-nominal { max-height:80vh; min-height:50vh; } }
  .kpi-total { display:inline-grid; gap:6px; min-width:260px; background:linear-gradient(135deg,#e8f6ee,#f3fbf6); border:1px solid var(--border); border-radius:18px; padding:26px 30px; }
  .kpi-total b { font-size:clamp(2.2rem,4vw,3rem); color:var(--accent); line-height:1; letter-spacing:-.02em; }
  .kpi-total span { color:var(--muted); font-size:1rem; }
  .cap { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; }
  .cap-col { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px 18px; }
  .cap-col h3 { margin:0 0 10px; font-size:.95rem; color:var(--accent-2); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .cap-col h3 b { background:var(--accent-soft); color:var(--accent); border-radius:999px; padding:3px 11px; font-size:.95rem; }
  .cap-fila { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--border); font-size:.95rem; }
  .cap-fila b { min-width:44px; text-align:center; border:1.5px solid var(--accent); border-radius:6px; padding:3px 8px; color:var(--accent); font-variant-numeric:tabular-nums; }
  .cap-total { display:flex; justify-content:space-between; align-items:center; margin-top:16px; padding:16px 20px; background:var(--accent-soft); border-radius:16px; font-weight:800; color:var(--accent); }
  .cap-total b { font-size:1.4rem; background:var(--surface); border:2px solid var(--accent); border-radius:8px; padding:4px 16px; }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ================= TEMA V3 · PÁGINA PÚBLICA (misma identidad de la portada) ================= */
:root{
  --basalto:#0E1A2B; --basalto-2:#16273D; --rio:#0F6B8A; --lago:#1FB5C4; --nieve:#F4F7FA;
  --rocoto:#D13B2F; --rocoto-2:#B02E24; --alba:#F2B58A; --maiz:#F5B83D; --indigo:#4F5FD5; --coral:#EF6F5E;
  --bg:#F4F7FA; --surface:#fff; --text:#14202F; --muted:#546274; --border:#D5DBE2;
  --accent:#16273D; --accent-2:#0F6B8A; --accent-soft:#E3EEF4; --gold:#F5B83D;
  --shadow:0 20px 44px -24px rgba(14,26,43,.38);
  --titulo:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --cuerpo:"Public Sans","Segoe UI",system-ui,sans-serif;
  --franja:linear-gradient(90deg,#D13B2F,#EF6F5E,#F5B83D,#F2B58A,#1FB5C4,#0F6B8A,#4F5FD5);
}
body{
  font-family:var(--cuerpo); color:var(--text);
  background:
    radial-gradient(900px 520px at 100% 0%, rgba(31,181,196,.10), transparent 60%),
    radial-gradient(800px 520px at 0% 38%, rgba(245,184,61,.12), transparent 60%),
    radial-gradient(700px 500px at 100% 80%, rgba(239,111,94,.07), transparent 60%),
    #F4F7FA;
  background-repeat:no-repeat; background-attachment:fixed; min-height:100vh;
}
h1,h2,h3,.titulo,.stat b,.kpi-p b,.kpi-total b,.cap-total b{ font-family:var(--titulo); }
:focus-visible{ outline:3px solid var(--alba); outline-offset:2px; }

/* ---- Barra superior ---- */
.barra-pub{
  background:rgba(14,26,43,.95); backdrop-filter:blur(12px);
  border-bottom:0; box-shadow:0 1px 0 rgba(255,255,255,.08);
  gap:4px; padding:9px 18px;
}
.barra-pub:after{ content:""; position:absolute; left:0; right:0; bottom:-3px; height:3px; background:var(--franja); }
.marca-pub{
  display:inline-flex; align-items:center; gap:10px; margin-right:14px;
  font-family:var(--titulo); font-weight:700; font-size:1.1rem; letter-spacing:-.01em; color:#fff;
}
.marca-pub .sello-pub{ background:#fff; border-radius:10px; padding:3px 7px; display:inline-flex; }
.marca-pub .sello-pub img{ height:32px; width:auto; display:block; }
.barra-pub button{
  background:transparent; border:0; color:#E8EEF4; border-radius:999px;
  padding:9px 16px; font-weight:500; font-size:.95rem; transition:background .2s,color .2s;
}
.barra-pub button:hover{ background:rgba(255,255,255,.13); transform:none; }
.barra-pub button.on{ background:linear-gradient(90deg,var(--maiz),var(--alba)); color:#2A1D00; font-weight:600; box-shadow:none; }
.barra-pub button.btn-usuarios{ background:var(--rocoto); color:#fff; font-weight:600; margin-left:auto; }
.barra-pub button.btn-usuarios:hover{ background:var(--rocoto-2); }

/* ---- Portada (usa la foto de la portada nueva; si falla, la anterior) ---- */
header.portada{ min-height:380px !important; background:var(--basalto); }
.portada-fondo{
  background-image:url('https://i.ibb.co/Fkdvk6PQ/Gemini-Generated-Image-6z2twb6z2twb6z2t.jpg');
  background-size:cover; background-position:center;
  animation:zoomFondo 24s ease-in-out infinite alternate;
}
@keyframes zoomFondo{ from{transform:scale(1)} to{transform:scale(1.1)} }
.portada-velo{
  background:linear-gradient(100deg,rgba(14,26,43,.92) 0%,rgba(14,26,43,.58) 55%,rgba(15,107,138,.28) 100%) !important;
  opacity:1 !important;
}
header.portada:after{ content:""; position:absolute; left:0; right:0; bottom:0; height:6px; background:var(--franja); }
@keyframes subir{ from{opacity:0; transform:translateY(26px)} to{opacity:1; transform:none} }
.portada-contenido{ padding:30px 40px 36px !important; }
.portada-contenido > *{ animation:subir .8s cubic-bezier(.2,.8,.2,1) both; }
.portada-contenido > *:nth-child(2){ animation-delay:.12s } .portada-contenido > *:nth-child(3){ animation-delay:.24s }
.portada-contenido > *:nth-child(4){ animation-delay:.36s } .portada-contenido > *:nth-child(5){ animation-delay:.48s }
.logo-ugel{ animation:none; border-radius:16px; padding:9px 14px; box-shadow:0 14px 34px -14px rgba(0,0,0,.55); }
.portada-contenido .eyebrow{

}
header.portada h1{
  font-family:var(--titulo); font-weight:800; font-size:clamp(2.4rem,6vw,4.6rem); line-height:1.04;

}
header.portada p{ color:#DCE6EF; font-size:clamp(1.05rem,1.8vw,1.25rem); max-width:36rem; }
.botones-portada{ margin-top:30px; }
.botones-portada button{ border-radius:999px; padding:14px 28px; font-weight:600; font-size:1rem; transition:background .2s,border-color .2s; }
.btn-p1{ background:var(--rocoto); color:#fff; border-color:transparent; box-shadow:none; animation:none; }
.btn-p1:hover{ background:var(--rocoto-2); }
.btn-p2{ background:rgba(255,255,255,.08); color:#fff; border:2px solid rgba(255,255,255,.55); }
.btn-p2:hover{ background:rgba(255,255,255,.18); }
.botones-portada button:hover{ transform:none; }

/* ---- Estadísticas ---- */
.stats{
  background:linear-gradient(120deg,var(--basalto) 0%,var(--basalto-2) 42%,var(--rio) 100%);
  border-radius:22px; box-shadow:var(--shadow); overflow:hidden; margin:30px 0 22px;
}
.stat{ color:#C6D6E4; border-right:1px solid rgba(255,255,255,.12); padding:22px 26px; font-size:.98rem; }
.stat b{ font-size:2.3rem; font-weight:800; letter-spacing:-.03em; line-height:1.1; text-shadow:none; }
.stat:nth-child(1) b{ color:var(--maiz); }
.stat:nth-child(2) b{ color:#7FE3EC; }
.stat:hover{ background:rgba(255,255,255,.06); transform:none; }

/* ---- Botones de acción y encabezados ---- */
.acciones-home{ display:flex; flex-wrap:wrap; gap:10px; margin:6px 0 10px; }
.ver-mapa{ background:var(--rocoto); color:#fff; border-radius:999px; padding:12px 24px; font-weight:600; box-shadow:none; transition:background .2s; }
.ver-mapa:hover{ background:var(--rocoto-2); transform:none; box-shadow:none; }
.ver-mapa.alt{ background:var(--rio); } .ver-mapa.alt:hover{ background:#0B566F; }
.ver-mapa.alt2{ background:var(--indigo); } .ver-mapa.alt2:hover{ background:#3F4DB8; }
.kicker-pub{
  display:flex; align-items:center; gap:10px; margin:30px 0 4px;
  color:var(--rocoto); font-weight:700; font-size:.98rem; letter-spacing:0; text-transform:none;
}
.kicker-pub:before{ content:""; width:30px; height:3px; border-radius:2px; background:var(--rocoto); }
.sec-pub{ font-family:var(--titulo); font-weight:700; font-size:clamp(1.8rem,3.4vw,2.6rem); letter-spacing:-.03em; color:var(--basalto-2); background:none; margin:0 0 18px; }
.titulo{ font-weight:700; font-size:clamp(1.8rem,3.8vw,2.7rem); letter-spacing:-.03em; color:var(--basalto-2); background:none; }
.sub{ color:var(--muted); }
h2.sec{ font-weight:700; font-size:1.3rem; color:var(--basalto-2); padding-left:14px; border-left:5px solid var(--maiz); }
.buscador,.filtro-anexo select,.nominal-cat{
  background:#fff; border:2px solid #CFE0E8; border-radius:14px; box-shadow:none; transition:border-color .2s,box-shadow .2s;
}
.buscador:focus,.filtro-anexo select:focus,.nominal-cat:focus{ border-color:var(--rio); box-shadow:0 0 0 4px rgba(15,107,138,.16); transform:none; outline:none; }
.volver{ border:2px solid #CFE0E8; color:var(--rio); background:#fff; font-weight:600; transition:background .2s,color .2s; }
.volver:hover{ background:var(--basalto-2); color:#fff; border-color:var(--basalto-2); transform:none; }

/* ---- Tarjetas de distrito: un color por tarjeta ---- */
.grid-d{ grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px; }
.grid-d .card:nth-child(4n+1), .cuadro:nth-child(4n+1){ --c1:#0F6B8A; --c2:#1FB5C4; }
.grid-d .card:nth-child(4n+2), .cuadro:nth-child(4n+2){ --c1:#D13B2F; --c2:#EF6F5E; }
.grid-d .card:nth-child(4n+3), .cuadro:nth-child(4n+3){ --c1:#E69A12; --c2:#F5B83D; }
.grid-d .card:nth-child(4n+4), .cuadro:nth-child(4n+4){ --c1:#4F5FD5; --c2:#8A7BE8; }
.card{
  --c1:#0F6B8A; --c2:#1FB5C4;
  overflow:hidden; border:1px solid var(--border); border-radius:22px; background:#fff;
  box-shadow:0 10px 26px -18px rgba(14,26,43,.4); transition:transform .25s,box-shadow .25s,border-color .25s;
}
.card:before{ display:block; content:""; height:7px; width:calc(100% + 42px); margin:-21px -21px 16px; border-radius:0; background:linear-gradient(90deg,var(--c1),var(--c2)); }
.card:hover,.card:focus-visible{ transform:translateY(-5px); box-shadow:0 22px 40px -22px rgba(14,26,43,.5); border-color:var(--c1); }
.card h2{ font-family:var(--titulo); font-size:1.35rem; font-weight:700; color:var(--basalto-2); }
.card .abre{ color:var(--c1); font-weight:700; transition:transform .2s; }
.card:hover .abre{ transform:translateX(6px); }

/* ---- Tarjetas de institución ---- */
.grid-ie{ grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:20px; }
.ie-card{ border-radius:22px; background:#fff; }
.ie-card:before{ display:none; }
.ie-card:hover{ border-color:var(--rio); }
.ie-img{ position:relative; overflow:hidden; background-color:#CFE0E8; color:#546274; }
.ie-info{ border-left:5px solid var(--maiz); }
.ie-info h2{ font-size:1.08rem; color:var(--basalto-2); }
.ie-info .meta b{ color:var(--rio); }
.ie-info .abre{ color:var(--rocoto); }
@media(max-width:640px){ .grid-ie{ grid-template-columns:1fr; } }

/* ---- Anexos ---- */
ol.anexos{ border:1px solid #CFE0E8; border-radius:18px; background:#fff; }
ol.anexos li::marker{ color:var(--rocoto); font-weight:700; }
ol.anexos li{ transition:color .2s,transform .2s; } ol.anexos li:hover{ color:var(--rio); transform:translateX(4px); }
.grupo-anexo{ color:var(--basalto-2); font-family:var(--titulo); }
.cant-g{ background:linear-gradient(90deg,var(--maiz),var(--alba)); color:#2A1D00; font-weight:700; }

/* ---- Ficha de la institución ---- */
.ficha{ border:0; box-shadow:0 20px 44px -26px rgba(14,26,43,.45); background:#fff; }
.car{ background:var(--basalto); }
.car .prev:hover,.car .next:hover{ background:var(--maiz); }
.car .cnt{ background:rgba(14,26,43,.7); }
dl.datos dt{ color:var(--muted); } dl.datos dd{ color:var(--text); }
.sub-h{ font-family:var(--titulo); font-size:1.05rem; font-weight:700; color:var(--rio); }
.kpi-p{ border:0; border-radius:16px; transition:transform .2s; }
.kpi-p:nth-child(4n+1){ background:#E1F1F6; } .kpi-p:nth-child(4n+1) b{ color:var(--rio); }
.kpi-p:nth-child(4n+2){ background:#FFF1D2; } .kpi-p:nth-child(4n+2) b{ color:#B87500; }
.kpi-p:nth-child(4n+3){ background:#FDE6E1; } .kpi-p:nth-child(4n+3) b{ color:var(--rocoto-2); }
.kpi-p:nth-child(4n+4){ background:#E8EAFB; } .kpi-p:nth-child(4n+4) b{ color:var(--indigo); }
.kpi-p:hover{ transform:translateY(-3px); }
.kpi-total{ background:linear-gradient(135deg,#E1F1F6,#FFF1D2); border:0; border-radius:20px; }
.kpi-total b{ color:var(--basalto-2); }
.chip{ background:#E3EEF4; color:var(--basalto-2); }
.chip:nth-child(3n+2){ background:#FFF1D2; } .chip:nth-child(3n+3){ background:#FDE6E1; }
.chip b{ color:var(--rio); }
.tabla-p,.tabla-nominal{ border:1px solid #D5E2EA; border-radius:16px; }
.tabla-p th,.tabla-nominal th{ background:#E3EEF4; color:var(--basalto-2); font-weight:700; }
.tabla-p tr:hover td{ background:#FFF8E6; }
.tabla-p td.num{ color:var(--rio); }
.tabla-nominal tbody tr:hover{ background:#F0F7FA; }
.mapa{ color:var(--rocoto); font-weight:700; }
.cap-col{ border-radius:18px; border-top:5px solid var(--rio); }
.cap-col:nth-child(4n+2){ border-top-color:var(--maiz); } .cap-col:nth-child(4n+3){ border-top-color:var(--rocoto); } .cap-col:nth-child(4n+4){ border-top-color:var(--indigo); }
.cap-col h3 b,.cap-total{ background:#E3EEF4; color:var(--basalto-2); }
.cap-fila b,.cap-total b{ border-color:var(--rio); color:var(--basalto-2); }

/* ---- Cuadros deslizables de la ficha ---- */
.cuadro{ --c1:#0F6B8A; --c2:#1FB5C4; border:1px solid var(--border); border-top:6px solid var(--c1); box-shadow:0 12px 28px -22px rgba(14,26,43,.4); }
.cuadro-num{ background:var(--c1); color:#fff; }
.cuadro-titulo{ font-family:var(--titulo); font-weight:700; color:var(--basalto-2); }
.cuadros-tabs button{ border:1px solid #CFE0E8; transition:background .2s; }
.cuadros-tabs button span{ background:#E3EEF4; color:var(--basalto-2); }
.cuadros-tabs button.on{ background:var(--basalto-2); border-color:var(--basalto-2); color:#fff; }
.cuadros-tabs button.on span{ background:var(--maiz); color:#2A1D00; }
.cuadros-dots button.on{ background:var(--rocoto); }
.cuadros-barra > button,.cuadros-nav button[data-cnav]{ color:var(--rio); border-color:#CFE0E8; }

/* ---- Mapa ---- */
.mapa-layout{ gap:20px; }
.mapa-wrap,.mapa-lista{ border:0; border-radius:20px; box-shadow:0 18px 40px -26px rgba(14,26,43,.5); }
.mapa-lista .mitem{ background:#fff; border:1px solid var(--border); border-left:6px solid var(--rio); transition:transform .2s,box-shadow .2s; }

.cap-col:hover{ transform:translateY(-4px); box-shadow:0 16px 28px -18px rgba(10,42,102,.5); }
.cap-col:nth-child(4n+2){ border-top-color:#3DAE4B !important; }
.cap-col:nth-child(4n+3){ border-top-color:#F2B632 !important; }
.cap-col:nth-child(4n+4){ border-top-color:#2DB7E8 !important; }
.cap-col h3 b, .cap-total{ background:#DDF1FB !important; color:#0F3578 !important; }
.cap-fila b, .cap-total b{ border-color:#1B7FD1 !important; color:#0F3578 !important; }

.ident-cab{ background:linear-gradient(135deg,#F2FAFF,#E6F4FC) !important; }
.ident-cod-caja{ transition:transform .25s,box-shadow .25s,border-color .25s; }
button.ident-cod-caja:hover{ transform:translateY(-4px); box-shadow:0 14px 24px -16px rgba(10,42,102,.55); border-color:#2DB7E8; }
.rac-caja{ transition:transform .25s,box-shadow .25s; }
.rac-caja:hover{ transform:translateY(-3px); box-shadow:0 12px 22px -16px rgba(10,42,102,.45); }

/* ---------- Cuadros deslizables ---------- */
.cuadro{ border-top:6px solid var(--c1) !important; background:linear-gradient(180deg,#fff,#F6FBFE) !important; box-shadow:0 14px 30px -22px rgba(10,42,102,.5) !important; }
.cuadro-titulo{ color:#0F3578 !important; }
.cuadros-tabs button{ border:1px solid #BFE0F2 !important; transition:transform .2s,background .2s,box-shadow .2s; }
.cuadros-tabs button:hover{ transform:translateY(-2px); }
.cuadros-tabs button span{ background:#DDF1FB !important; color:#0F3578 !important; }
.cuadros-tabs button.on{ background:linear-gradient(90deg,#0F3F95,#1B7FD1) !important; border-color:transparent !important; color:#fff !important; box-shadow:0 8px 18px -8px rgba(20,86,184,.6); }
.cuadros-tabs button.on span{ background:#F2B632 !important; color:#2A1D00 !important; }
.cuadros-dots button.on{ background:#2DB7E8 !important; }
.cuadros-barra > button, .cuadros-nav button[data-cnav]{ color:#1B7FD1 !important; border-color:#BFE0F2 !important; transition:transform .2s,background .2s,color .2s; }
.cuadros-barra > button:hover, .cuadros-nav button[data-cnav]:hover{ background:#1B7FD1 !important; color:#fff !important; transform:scale(1.1); }

/* ---------- Mapa ---------- */
.mapa-layout{ gap:20px !important; }
.mapa-wrap, .mapa-lista{ border:0 !important; border-radius:20px !important; box-shadow:0 18px 40px -26px rgba(10,42,102,.55) !important; }
.mapa-lista .mitem{ border-left:6px solid #1B7FD1 !important; background:#fff !important; transition:transform .25s,box-shadow .25s,background .25s; }
.mapa-lista .mitem:nth-child(3n+2){ border-left-color:#3DAE4B !important; }
.mapa-lista .mitem:nth-child(3n+3){ border-left-color:#F2B632 !important; }
.mapa-lista .mitem:hover{ transform:translateX(6px); box-shadow:0 10px 20px -12px rgba(10,42,102,.5); }
.mapa-lista .mitem.activo{ background:#E6F5FD !important; border-color:#2DB7E8 !important; }
.mitem strong, .pop-t{ color:#0F3578 !important; }
.pop-b a, .pop-b button{ background:linear-gradient(90deg,#1456B8,#2DB7E8) !important; border-radius:999px !important; transition:transform .2s; }
.pop-b a:hover, .pop-b button:hover{ transform:translateY(-2px); }
.etiq-ie{ background:#fff !important; color:#0F3578 !important; border-left:3px solid #2DB7E8 !important; }

/* ---------- Ventana de acceso y extras ---------- */
.modal-fondo{ background:rgba(6,30,80,.6) !important; }
.modal-caja{ border-top:6px solid #2DB7E8 !important; border-radius:22px !important; animation:u-subir .4s ease both; }
.modal-caja h3{ color:#0F3578 !important; }
.acciones-modal button.primario{ background:linear-gradient(90deg,#1456B8,#2DB7E8) !important; }
.acciones-modal button{ background:#DDF1FB; color:#0F3578; }
.ir-panel{ color:#1B7FD1 !important; }
.estado{ border:2px dashed #BFE0F2 !important; background:rgba(255,255,255,.8) !important; }
.ux-table-help{ color:#4D6585 !important; }
.ux-backtop{ background:linear-gradient(135deg,#1456B8,#2DB7E8) !important; color:#fff !important; border:0 !important; box-shadow:0 12px 26px -8px rgba(20,86,184,.65) !important; }
.ux-backtop:hover{ transform:translateY(-4px) scale(1.08) !important; }
:focus-visible{ outline:3px solid #7BD8F5 !important; outline-offset:2px; }

/* ---------- Barras de desplazamiento ---------- */
*{ scrollbar-color:#2DB7E8 #E3F2FA; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:linear-gradient(#2DB7E8,#1456B8); border-radius:10px; }
::-webkit-scrollbar-track{ background:#E3F2FA; border-radius:10px; }

@media(max-width:640px){ body::before{ width:220px; height:220px; } body::after{ width:180px; height:180px; } .barra-pub .btn-usuarios{ margin-left:0; } }
@media(prefers-reduced-motion:reduce){ *, *::before, *::after{ animation:none !important; transition:none !important; } }

<body>

  <button type="button" data-nav="inicio" class="on">Inicio</button>

</nav>
<div class="wrap">

        <button type="button" class="primario" id="loginEntrar">Entrar</button>

      <p>Acceso concedido.</p>
      <p><a class="ir-panel" id="linkPanel" href="#" target="_blank" rel="noopener">Abrir panel de administración ↗</a></p>
      <div class="acciones-modal"><button type="button" id="loginSalir">Cerrar</button></div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAFgNjK2x9a1E4Z0JFuforqmX1hulPovYo",
    authDomain: "registro-personas-1efc5.firebaseapp.com",
    projectId: "registro-personas-1efc5",
    storageBucket: "registro-personas-1efc5.firebasestorage.app",
    messagingSenderId: "2550255826",
    appId: "1:2550255826:web:f914eaa700e58578855d0b"
  };

  // Orden de los distritos y datos de respaldo (si Firestore no responde).
  const DISTRITOS_BASE = [
    // Catálogo de anexos y localidades tomado del Excel "IE de Castilla con distrito y anexo.xlsx".
    // Se conservan las denominaciones tal como aparecen en la fuente, incluidas sus variantes.
    { clave:"Aplao", nombre:"Aplao", capital:"Aplao (capital provincial)", anexos:["Acoy","Aplao","Caspani","Casquina","Cochate","Cosos","Fundo El Castillo","Hacienda Andamayo","Hacienda La Central","Hacienda La Real","Hacienda Querulpa Chico","La Barranca","La Real","Mamas","Ongoro","San Jose De Huatiapilla","Querulpa","El Monte","Nueva Central","Andamayo","La Central"] },
    { clave:"Andagua", nombre:"Andagua", capital:"", anexos:["Andagua","Andahua","Jallua / Callhuas","Orahuasto","San Antonio","Soporo"] },
    { clave:"Ayo", nombre:"Ayo", capital:"", anexos:["Ayo","Subna"] },
    { clave:"Chachas", nombre:"Chachas", capital:"", anexos:["Chachas","Checotaña","Huaracopalca","Huaracopallca","Huaytapalca","Nahuira","Tolcone / Capilla","Tolconi"] },
    { clave:"Chilcaymarca", nombre:"Chilcaymarca", capital:"", anexos:["Chapacoco","Chilcaimarca","Chilcaymarca"] },
    { clave:"Choco", nombre:"Choco", capital:"", anexos:["Choco","Hujuyo","Llanca","Miña","Ojuyo","Pachauma","Pampuyo","Sihuincha"] },
    { clave:"Huancarqui", nombre:"Huancarqui", capital:"", anexos:["Huancarqui"] },
    { clave:"Machaguay", nombre:"Machaguay", capital:"", anexos:["Acopallpa","Cotanay","Machaguay","Vista Alegre"] },
    { clave:"Orcopampa", nombre:"Orcopampa", capital:"", anexos:["Condorhuaycco","Huancarama","La Laguna","Misahuanca","Orcopampa","Rumihuasi","Sarpane","Tintaymarca","Vista Alegre"] },
    { clave:"Pampacolca", nombre:"Pampacolca", capital:"", anexos:["Pampacolca","Piscopampa","Quiscata","San Antonio","Tuhuallqui"] },
    { clave:"Tipán", nombre:"Tipán", capital:"", anexos:["Chupacra","Tagre","Tipan","Yacmes"] },
    { clave:"Uñón", nombre:"Uñón", capital:"", anexos:["Piraucho","Uñon"] },
    { clave:"Uraca", nombre:"Uraca", capital:"", anexos:["Corire","El Dique","Escalerillas","Goyeneche","Hacienda Cantas","Hacienda Goyeneche","Hacienda Toran","La Candelaria","Mesana","Pedregal","Punta Colorada","Sahuani","Sarcas","Satelite Salvador","Torete","Uracra"] },
    { clave:"Viraco", nombre:"Viraco", capital:"", anexos:["Arejocha","Costuro","Huami","Pampachacra","Rituy","Unro","Viraco","Yaso"] }
  ];
  const RESPALDO = [
    { distrito:"Aplao", nombre:"Colegio Nacional Libertador Castilla de Aplao", tipo:"Instituto de secundaria", direccion:"Av. 21 de Marzo 109, Aplao" },
    { distrito:"Aplao", nombre:"I. E. Nuestra Señora De Las Peñas", tipo:"Instituto de secundaria", direccion:"Calle Juan Pablo Vizcardo y Guzmán, Aplao" },
    { distrito:"Aplao", nombre:"I.E.P. \"San Tarcisio\"", tipo:"Escuela", direccion:"Av. 3 de Abril s/n (Zona Buenos Aires), Aplao" },
    { distrito:"Aplao", nombre:"I.E. Angela Rendón de Sánchez", tipo:"Institución educativa", codigo:"40307", direccion:"Av. Juan Pablo Vizcardo y Guzmán, Aplao" },
    { distrito:"Aplao", nombre:"I.E. 40440 Corazón de Fátima", tipo:"Escuela", codigo:"40440", direccion:"Calle Jorge Chávez, Aplao" }
  ];
  DISTRITOS_BASE.slice(1).forEach(d => {
    RESPALDO.push({ distrito:d.clave, nombre:`IE ficticia ${d.clave} 1`, tipo:"Escuela (ficticia)", direccion:"Dirección de prueba" });
    RESPALDO.push({ distrito:d.clave, nombre:`IE ficticia ${d.clave} 2`, tipo:"Instituto (ficticio)", direccion:"Dirección de prueba" });
  });

  const app = document.getElementById("app");
  const avisoEl = document.getElementById("aviso");
  // Muestra mensajes en el aviso de la página (faltaba esta función: las descargas fallaban sin mostrar nada)
  function aviso(texto) {
    if (avisoEl) { avisoEl.textContent = texto; avisoEl.className = "aviso"; avisoEl.hidden = false; }
    else alert(texto);
  }
  let todas = [];     // instituciones (el índice de este arreglo identifica cada IE)
  let distritos = [];
  let fuente = "Cargando…";
  let personalVisible = [];

  // Pila de vistas: home, distrito o ficha. Todo ocurre en esta misma pestaña.
  const estado = { pila: [{ tipo:"home" }], q: "", foto: 0, racNivel: null, tolerancia: 4 };
  // Parámetros definidos por la UGEL en el panel (pestaña Análisis).
  let reglasCfg = {};
  let inicialCfg = null;

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const cssUrl = u => String(u ?? "").replace(/'/g, "%27");
  const portadaDe = ie => (ie.imagenes && ie.imagenes[0]) || ie.imagen || "";
  const fotosDe = ie => (ie.imagenes && ie.imagenes.length) ? ie.imagenes : (ie.imagen ? [ie.imagen] : []);

  function ordenarIE(lista) {
    return lista.slice().sort((a, b) =>
      DISTRITOS_BASE.findIndex(d => d.clave === a.distrito) - DISTRITOS_BASE.findIndex(d => d.clave === b.distrito) ||
      String(a.nombre).localeCompare(String(b.nombre), "es"));
  }

  // Tarjeta resumida: datos clave en orden fijo. La ficha muestra todo lo guardado.
  // Ajuste de posición y tamaño guardado para cada foto (por dirección de la imagen).
  function ajusteFoto(ie, url) {
    return (ie && ie.fotoAjustes && ie.fotoAjustes[url]) || { x: 50, y: 50, z: 100 };
  }
  // Modalidad según el nivel educativo de la plaza: EBR, EBA, EBE, ETP o UGEL.
  function modalidadDe(nivel) {
    const u = sinTildes(nivel || "");
    if (!u) return "—";
    if (u.includes("alternativa")) return "EBA";
    if (u.includes("especial")) return "EBE";
    if (u.includes("tecnico") || u.includes("productiva")) return "ETP";
    if (u.includes("inicial") || u.includes("primaria") || u.includes("secundaria")) return "EBR";
    if (u.includes("administracion")) return "UGEL";
    return "—";
  }
  // Orden fijo de los niveles: Inicial, Primaria, Secundaria y después los demás.
  function ordenNivel(n) {
    const u = sinTildes(n || "");
    if (u.includes("inicial")) return 0;
    if (u.includes("primaria")) return 1;
    if (u.includes("secundaria")) return 2;
    return 3;
  }
  function ieCard(i) {
    const ie = todas[i];
    const portada = portadaDe(ie);
    const filas = [
      ["Nivel", ie.nivel || ie.tipo],
      ["Gestión", ie.gestion],
      ["Zona", [ie.zona, ie.frontera === true ? "Frontera" : null].filter(Boolean).join(" · ")],
      ["Docentes", ie.docentes],
      ...((ie.matriculaPorNivel || []).length > 1
        ? [["Estudiantes", ie.estudiantes], ...[...ie.matriculaPorNivel].sort((a, b) => ordenNivel(a.nivel) - ordenNivel(b.nivel)).map(m => [`↳ ${m.nivel}`, m.matricula])]
        : [["Estudiantes", ie.estudiantes]]),
      ["Director", ie.director],
      ["Subdirector", ie.subdirector !== "No hay" ? ie.subdirector : null]
    ].filter(([, v]) => v !== undefined && v !== null && v !== "");
    return `<button type="button" class="card ie-card" data-ie="${i}">
      <div class="ie-img" style="background-image:url('${cssUrl(portada)}');background-position:${ajusteFoto(ie, portada).x}% ${ajusteFoto(ie, portada).y}%;background-size:${ajusteFoto(ie, portada).z}% auto">${portada ? "" : "Sin foto"}</div>
      <div class="ie-info">
        <h2>${esc(ie.nombre)}</h2>
        ${filas.map(([k, v]) => `<div class="meta"><b>${esc(k)}:</b> ${esc(v)}</div>`).join("")}
        <div class="abre">Ver ficha completa →</div>
      </div></button>`;
  }

  // ---------- Vistas ----------
  function selectAnexo() {
    const grupos = distritos.filter(d => d.anexos && d.anexos.length).map(d =>
      `<optgroup label="${esc(d.nombre)}">${d.anexos.map(a => `<option value="${esc(a)}" ${estado.anexo === a ? "selected" : ""}>${esc(a)} (${todas.filter(x => x.anexo === a).length})</option>`).join("")}</optgroup>`).join("");
    return `<label class="filtro-anexo">Filtrar por anexo
      <select id="filtroAnexo">
        <option value="">Todos los anexos</option>
        <option value="__sede__" ${estado.anexo === "__sede__" ? "selected" : ""}>Sede principal (${todas.filter(x => !x.anexo).length})</option>
        ${grupos}
      </select></label>`;
  }
  function vistaHome() {
    return `
      <div class="stats">
        <div class="stat"><b id="totalIE">0</b> instituciones</div>
        <div class="stat"><b id="totalDist">0</b> distritos con datos</div>
        <div class="stat">${esc(fuente)}</div>
      </div>
      <div class="acciones-home"><button type="button" class="ver-mapa" data-mapa>🗺️ Ver mapa de instituciones</button> <button type="button" class="ver-mapa" style="background:#1e5b8f" data-refrescar>↻ Actualizar datos</button></div>
      <p class="kicker-pub">Explora la provincia</p><h2 class="sec-pub">Distritos y búsqueda</h2>
      <input class="buscador" id="buscar" type="search" value="${esc(estado.q)}" aria-label="Buscar instituciones" placeholder="⌕  Buscar por distrito, anexo, institución, nivel o director…">
      ${selectAnexo()}
      <div id="resultados"></div>`;
  }

  function pintarResultados() {
    const q = (estado.q || "").trim().toLowerCase();
    const anex = estado.anexo || "";
    const idx = todas.map((_, i) => i).filter(i => (!q || [todas[i].nombre, todas[i].tipo, todas[i].direccion, todas[i].distrito]
      .some(v => String(v ?? "").toLowerCase().includes(q)) || coincideBusquedaPub(todas[i], q))
      && (!anex || (anex === "__sede__" ? !todas[i].anexo : todas[i].anexo === anex)));
    document.getElementById("totalIE").textContent = idx.length;
    document.getElementById("totalDist").textContent = new Set(idx.map(i => todas[i].distrito)).size;
    const r = document.getElementById("resultados");
    if (q || anex) {
      r.innerHTML = idx.length ? `<div class="grid-ie">${idx.map(ieCard).join("")}</div>` : `<p class="estado">No hay instituciones que coincidan con el filtro.</p>`;
      return;
    }
    r.innerHTML = `<div class="grid-d">${distritos.filter(d => d.activo).map(d => {
      const cant = todas.filter(x => x.distrito === d.clave).length;
      return `<button type="button" class="card" data-d="${esc(d.clave)}">
        <h2>${esc(d.nombre)}</h2>
        <div class="meta">${cant} instituciones · ${d.anexos.length ? d.anexos.length + " anexos" : "anexos por completar"}</div>
        <div class="abre">Ver distrito →</div></button>`;
    }).join("")}</div>`;
  }

  function vistaDistrito(clave) {
    const d = distritos.find(x => x.clave === clave);
    return `
      <button type="button" class="volver" data-volver>← Volver a distritos</button>
      <h1 class="titulo">Distrito de ${esc(d.nombre)}</h1>
      <p class="sub">Provincia de Castilla, Arequipa${d.capital ? " · " + esc(d.capital) : ""}</p>
      <h2 class="sec">Anexos (${d.anexos.length})</h2>
      ${d.anexos.length ? `<ol class="anexos">${d.anexos.map(a => `<li>${esc(a)}</li>`).join("")}</ol>`
        : `<p class="vacio">La lista de anexos de este distrito aún no está cargada.</p>`}
      <h2 class="sec">Instituciones educativas</h2>
      <input class="buscador" id="buscarDist" type="search" value="${esc(estado.dq || "")}" aria-label="Buscar en este distrito" placeholder="⌕  Buscar por nombre, nivel, director, anexo, gestión o zona…">
      <div id="gruposDist"></div>
      <p class="sub" style="margin-top:22px">Anexos según fuentes disponibles; pueden no ser la lista completa.</p>`;
  }

  // Búsqueda aproximada sobre varios campos (ignora acentos y tolera un error por palabra).
  function coincideBusqueda(campos, q) {
    const norm = s => sinTildes(s).replace(/[^a-z0-9]+/g, " ").trim();
    const tokens = norm(q).split(" ").filter(Boolean);
    if (!tokens.length) return true;
    const texto = norm(campos.map(c => c ?? "").join(" "));
    const palabras = texto.split(" ").filter(Boolean);
    return tokens.every(tk => texto.includes(tk) || palabras.some(w => tk.length >= 4 && distEdPub(w.slice(0, tk.length + 1), tk) <= 1));
  }

  // Agrupa las instituciones del distrito por anexo: primero la sede principal y luego cada anexo.
  function pintarGruposDistrito() {
    const cont = document.getElementById("gruposDist");
    const top = estado.pila[estado.pila.length - 1];
    if (!cont || !top || top.tipo !== "distrito") return;
    const d = distritos.find(x => x.clave === top.clave);
    const q = (estado.dq || "").trim();
    const idx = todas.map((_, i) => i).filter(i => todas[i].distrito === top.clave);
    if (!idx.length) { cont.innerHTML = `<p class="vacio">Sin instituciones cargadas.</p>`; return; }
    const visibles = idx.filter(i => !q || coincideBusqueda([todas[i].nombre, todas[i].tipo, todas[i].nivel, todas[i].direccion,
      todas[i].director, todas[i].subdirector, todas[i].anexo, todas[i].gestion, todas[i].zona, todas[i].distrito], q));
    if (!visibles.length) { cont.innerHTML = `<p class="estado">No hay instituciones que coincidan con la búsqueda.</p>`; return; }
    const grupos = [{ nombre: "Sede principal", items: [] }, ...d.anexos.map(a => ({ nombre: a, items: [] }))];
    visibles.forEach(i => {
      const a = (todas[i].anexo || "").trim();
      let g = a ? grupos.find(x => sinTildes(x.nombre) === sinTildes(a)) : grupos[0];
      if (!g) { g = { nombre: a, items: [] }; grupos.push(g); }
      g.items.push(i);
    });
    cont.innerHTML = grupos.filter(g => g.items.length).map(g => `
      <h3 class="sub-h grupo-anexo">${esc(g.nombre)} <span class="cant-g">${g.items.length}</span></h3>
      <div class="grid-ie">${g.items.map(ieCard).join("")}</div>`).join("");
  }

  function vistaFicha(i) {
    const ie = todas[i];
    const fotos = fotosDe(ie);
    const f = fotos.length ? Math.min(estado.foto, fotos.length - 1) : 0;
    const carrusel = fotos.length
      ? `<div class="car">

    const vacio = v => v === undefined || v === null || v === "";

    const cargos = (ie.personalPublico || []).map(x => `${x.cargo}: ${x.cantidad}`).join(" · ");

    const pers = ie.personalPublico || [];
    const chips = txt => String(txt || "").split(";").map(x => x.trim()).filter(Boolean).map(x => {
      const partes = x.split(":").map(y => y.trim());

    const filaCargo = x => `<tr><td>${esc(x.cargo)}</td><td class="num">${esc(x.cantidad)}</td><td>${x.situacion ? chips(x.situacion) : ""}</td></tr>`;
    const kpis = [["Docentes", ie.docentes], ["Administrativos", ie.administrativos], ["CAS", ie.cas]].filter(([, v]) => !vacio(v));
    const grupoChips = (titulo, txt) => txt ? `<h3 class="sub-h">${esc(titulo)}</h3><div class="chips">${chips(txt)}</div>` : "";
    const nomCore = s => sinTildes(String(s || "")).replace(/\b\d{4,7}\b/g, " ").replace(/[^a-z0-9]+/g, " ")
      .split(" ").filter(w => w.length > 1 && !["ie", "iep", "iei", "nro", "no"].includes(w)).join(" ");
    const visiblesIE = personalVisible.filter(x => (ie.claveUGEL && x.claveUGEL === ie.claveUGEL) ||

    const filasNominal = visiblesIE.map(x => {
      const txt = sinTildes([x.codigoPlaza, x.codigoPersona, x.nombreCompleto, x.cargo, x.nivelEducativo, modalidadDe(x.nivelEducativo), x.situacionLaboral, x.jornada, x.categoria, x.regimen, x.tipoRegistro].join(" "));
      return `<tr data-txt="${esc(txt)}" data-cat="${esc(String(x.categoria || "").trim())}"><td>${esc(x.codigoPlaza)}</td><td>${esc(x.codigoPersona)}</td><td>${esc(x.nombreCompleto)}</td><td>${esc(x.cargo)}</td><td>${esc(x.nivelEducativo || "—")}</td><td><b>${esc(modalidadDe(x.nivelEducativo))}</b></td><td>${esc(x.situacionLaboral)}</td><td>${esc(x.jornada)}</td><td>${esc(x.categoria)}</td><td>${esc(x.regimen)}</td><td>${esc(x.tipoRegistro)}</td></tr>`;
    }).join("");
    const tipoDe = x => sinTildes(x.tipoTrabajador || "");
    const resumenNominal = {
      registros: visiblesIE.length,

    const catsNominal = [...new Set(visiblesIE.map(x => String(x.categoria || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
    const plazasHtml = visiblesIE.length ? `<div class="nominal-barra">

      </div>

    const matr = [...(ie.matriculaPorNivel || [])].sort((a, b) => ordenNivel(a.nivel) - ordenNivel(b.nivel));
    const matriculaHtml = matr.length ? `<h2 class="sec">Matrícula</h2>
      <div class="tabla-p"><table><thead><tr><th>Nivel</th><th>Código modular</th><th class="num">Matrícula</th><th class="num">Definitiva</th><th class="num">En proceso</th><th class="num">Grados</th></tr></thead>
      <tbody>${matr.map(x => `<tr><td>${esc(x.nivel)}</td><td>${esc(x.codigo)}</td><td class="num">${esc(x.matricula)}</td><td class="num">${esc(x.definitiva)}</td><td class="num">${esc(x.enProceso)}</td><td class="num">${esc(x.grados)}</td></tr>`).join("")}
      <tr><td><b>Total</b></td><td></td><td class="num">${esc(ie.estudiantes ?? "")}</td><td></td><td></td><td></td></tr></tbody></table></div>` : "";
    const estudiantesHtml = matr.some(x => (x.detalle || []).length) ? `<h2 class="sec">Estudiantes por grado</h2>` + matr.filter(x => (x.detalle || []).length).map(x => {
      const suma = k => x.detalle.reduce((tt, d) => tt + Number(d[k] || 0), 0);
      return `<h3 class="sub-h">${esc(x.nivel)}${x.secciones ? " · " + esc(x.secciones) + " secciones" : ""}</h3>
        <div class="tabla-p"><table><thead><tr><th>Grado / edad</th><th class="num">Hombres</th><th class="num">Mujeres</th><th class="num">Total</th></tr></thead>
        <tbody>${x.detalle.map(d => `<tr><td>${esc(d.grado)}</td><td class="num">${esc(d.hombres)}</td><td class="num">${esc(d.mujeres)}</td><td class="num">${esc(d.total)}</td></tr>`).join("")}
        <tr><td><b>Total ${esc(x.nivel)}</b></td><td class="num">${suma("hombres")}</td><td class="num">${suma("mujeres")}</td><td class="num">${suma("total")}</td></tr></tbody></table></div>`;
    }).join("") : "";
    const GRUPOS = ["Jerárquico", "Docente", "Administrativo", "CAS"];
    const grupoCargo = c => {
      const u = sinTildes(c || "");
      if (/director|coord.*pedag/.test(u)) return "Jerárquico";
      if (/profesor|auxiliar de educacion|auxiliar educacion/.test(u)) return "Docente";
      if (/secretar|oficinista|auxiliar de biblioteca|auxiliar de laboratorio|trabajador de servicio/.test(u)) return "Administrativo";
      return "CAS";
    };
    const grupoDe = x => x.grupo || grupoCargo(x.cargo);
    const bloqueGrupos = pers.length ? `<h3 class="sub-h">Personal por grupo</h3>
      <div class="tabla-p"><table><thead><tr><th>Grupo</th><th>Cargo</th><th class="num">Total</th><th>Situación laboral</th></tr></thead><tbody>
      ${GRUPOS.map(g => {
        const items = pers.filter(x => grupoDe(x) === g);
        if (!items.length) return "";
        const tot = items.reduce((tt, c) => tt + Number(c.cantidad || 0), 0);
        return items.map((c, i) => `<tr>${i === 0 ? `<td rowspan="${items.length}"><b>${esc(g)}</b><br><span class="cant-g">${tot}</span></td>` : ""}<td>${esc(c.cargo)}</td><td class="num">${esc(c.cantidad)}</td><td>${c.situacion ? chips(c.situacion) : ""}</td></tr>`).join("");
      }).join("")}
      </tbody></table></div>` : "";
    const docentesTotal = (ie.docentes !== undefined && ie.docentes !== null && ie.docentes !== "")
      ? ie.docentes
      : visiblesIE.filter(x => /docen/.test(sinTildes(x.tipoTrabajador || ""))).length;
    let ultimoResumenAnalisis = null;
    // Código modular que corresponde a cada nivel (Inicial, Primaria o Secundaria).
    function codModPorNivel(ie, nombre) {
      const m = (ie.matriculaPorNivel || []).find(x => sinTildes(x.nivel || "").includes(nombre.toLowerCase()));
      return m && m.codigo ? m.codigo : "—";
    }
    // Etiqueta visible cuando un nivel tiene criterio flexible.
    function badgeFlex(ie, nivel) {
      const cod = codModPorNivel(ie, nivel);
      const c = (ie.criteriosFlexibles || {})[cod];
      const grados = c && c.grados ? Object.keys(c.grados).length : 0;
      return grados ? `<em class="flex-badge">Criterio flexible en ${grados} grado(s)</em>` : "";
    }
    // Sexta pestaña: resumen del análisis (totales por color y resultado de cada grado).
    function resumenAnalisisHtml() {
      const r = ultimoResumenAnalisis;
      window.__analisisDetalle = r || null;
      if (!r) return `<p class="vacio">Sin datos para resumir.</p>`;
      const nombres = { verde: "Verde", amarillo: "Amarillo", rojo: "Rojo", gris: "Gris" };
      const pills = ["verde", "amarillo", "rojo", "gris"].map(k => `<span class="rac-pill ${k}">${nombres[k]} ${r.cuenta[k] || 0}</span>`).join("");
      const filas = r.resumenGrados.map(g => `<tr><td>${esc(g.nivel)}</td><td>${esc(g.grado)}</td><td><span class="rac-pill ${g.color}">${esc(nombres[g.color] || g.color)}</span></td><td>${esc(g.alcance || "—")}</td></tr>`).join("");
      return `<div class="rac-resumen-total">${pills}</div>
        <div class="tabla-p"><table><thead><tr><th>Nivel</th><th>Grado</th><th>Resultado</th><th>Alcance</th></tr></thead>
        <tbody>${filas || `<tr><td colspan="4">Sin grados para analizar.</td></tr>`}</tbody></table></div>
        <p class="nota">Tolerancia de flexibilidad: <b>${esc(r.tol)}</b> estudiantes. Verde: cumple. Amarillo: necesita revisión. Rojo: no cumple. Gris: falta un dato.</p>`;
    }
    // Mínimos de estudiantes por sección (RVM 071-2024, Educación Básica Regular).
    // null = la tabla no aplica en esa zona.
    const MINIMOS_RVM071 = [
      { id: "inicial-unidocente", nivel: "inicial", tipo: /unidocente/, urbana: null, rural: 15 },
      { id: "inicial-polidocente", nivel: "inicial", tipo: /polidocente/, urbana: 25, rural: 20 },
      { id: "primaria-unidocente", nivel: "primaria", tipo: /unidocente/, urbana: null, rural: 15 },
      { id: "primaria-multigrado", nivel: "primaria", tipo: /multigrado/, urbana: 25, rural: 20 },
      { id: "primaria-polidocente", nivel: "primaria", tipo: /polidocente/, urbana: 30, rural: 25 },
      { id: "secundaria-polidocente", nivel: "secundaria", tipo: /polidocente/, urbana: 30, rural: 25 }
    ];

    function analisisRacionalizacion(ie) {
      const zona = sinTildes(ie.zona || "");
      const esRural = zona.includes("rural");
      const esUrbana = zona.includes("urban");
      const tipoIE = sinTildes(ie.tipoIE || "");
      const minPara = r => { const c = reglasCfg[r.id] || {}; return esRural ? ("minR" in c ? c.minR : r.rural) : ("minU" in c ? c.minU : r.urbana); };
      // Criterio temporal de Inicial: rangos sobre el total del nivel (ejemplo de la UGEL).
      const rangosInicial = () => {
        const z = esRural ? "rural" : "urbana";
        const base = esRural ? { rojoHasta: 25, amarilloHasta: 44, verdeHasta: 50 } : { rojoHasta: 30, amarilloHasta: 44, verdeHasta: 50 };
        return { ...base, ...((inicialCfg && inicialCfg[z]) || {}) };
      };
      const inicialBloque = m => {
        const c = rangosInicial();
        const tot = Number(m.matricula) || 0;
        const sec = Number(m.secciones) || 0;
        const amarilloDesde = c.rojoHasta + 1;
        const verdeDesde = c.amarilloHasta + 1;
        let color, etiqueta, alcance = "";
        if (!esRural && !esUrbana) { color = "gris"; etiqueta = "Gris: falta la zona"; }
        else if (tot > c.verdeHasta) { color = "amarillo"; etiqueta = "Desdoblar secciones"; alcance = `más de ${c.verdeHasta} estudiantes`; }
        else if (tot >= verdeDesde) { color = "verde"; etiqueta = "Verde: cumple"; }
        else if (tot >= amarilloDesde) { color = "amarillo"; etiqueta = "Amarillo: necesita revisión"; alcance = `${amarilloDesde}–${c.amarilloHasta} estudiantes`; }
        else { color = "rojo"; etiqueta = "Rojo: no cumple"; alcance = `hasta ${c.rojoHasta} estudiantes`; }
        cuenta[color]++;
        resumenGrados.push({ nivel: m.nivel, grado: "Total del nivel", color, alcance });
        return `<h3 class="rac-nivel">${esc(m.nivel)} · código ${esc(m.codigo || "—")} · criterio temporal</h3>
          <div class="rac-grid"><div class="rac-caja ${color}">
            <div class="rac-cab"><b>Total del nivel</b><span>${sec} sec. · ${tot} est.</span></div>
            <div class="rac-color">${esc(etiqueta)}</div>
            ${alcance ? `<div class="rac-alcance">${esc(alcance)}</div>` : ""}
            <div class="rac-sug">Rojo hasta ${c.rojoHasta} · Amarillo ${amarilloDesde}–${c.amarilloHasta} · Verde ${verdeDesde}–${c.verdeHasta} · Más de ${c.verdeHasta}: desdoblar.</div>
          </div></div>`;
      };
      const tolPara = r => { if (!r) return estado.tolerancia; const c = reglasCfg[r.id] || {}; const v = esRural ? c.tolR : c.tolU; return typeof v === "number" ? v : estado.tolerancia; };
      const tol = Math.max(0, Math.min(10, Number(estado.tolerancia) || 0));
      const todos = [...(ie.matriculaPorNivel || [])].sort((x, y) => ordenNivel(x.nivel) - ordenNivel(y.nivel));
      const filtro = estado.racNivel ? sinTildes(estado.racNivel) : "";
      const niveles = filtro ? todos.filter(m => sinTildes(m.nivel || "").includes(filtro)) : todos;
      const parametros = todos.map(m => {
        const nv = sinTildes(m.nivel || "");
        const clave = nv.includes("inicial") ? "inicial" : nv.includes("primaria") ? "primaria" : nv.includes("secundaria") ? "secundaria" : null;
        const regla = clave && tipoIE ? MINIMOS_RVM071.find(r => r.nivel === clave && r.tipo.test(tipoIE)) : null;
        const minimo = regla ? minPara(regla) : null;
        if (clave === "inicial") return `<span><b>${esc(m.nivel)}:</b> criterio temporal (total del nivel)</span>`;
        return `<span><b>${esc(m.nivel)}:</b> ${minimo == null ? "sin dato" : minimo + " por sección"}</span>`;
      }).join("");
      const flexResumen = todos.flatMap(m => Object.entries(((ie.criteriosFlexibles || {})[m.codigo] || {}).grados || {}).map(([gr, d]) => `${esc(m.nivel)} · ${esc(gr)}: ${esc(d.n)} sección(es) con ${esc(d.minimo)}`));
      const cabeza = `<div class="rac-barra">
          <span class="rac-tol">Tolerancia de flexibilidad: <b>${tol}</b> estudiantes (definida por la UGEL)</span>
          ${filtro ? `<button type="button" class="mini" data-rac-todos="1">Ver todos los niveles</button>` : ""}
        </div>
        <p class="nota rac-param">Mínimo por sección: ${parametros}</p>
        ${flexResumen.length ? `<p class="rac-flex">Esta institución usa criterio flexible en: <b>${flexResumen.join(" · ")}</b></p>` : ""}`;
      if (!niveles.length) return `${cabeza}<p class="vacio">Sin datos de matrícula para analizar.</p>`;
      const cuenta = { verde: 0, amarillo: 0, rojo: 0, gris: 0 };
      const resumenGrados = [];
      const bloques = niveles.map(m => {
        const nv = sinTildes(m.nivel || "");
        const clave = nv.includes("inicial") ? "inicial" : nv.includes("primaria") ? "primaria" : nv.includes("secundaria") ? "secundaria" : null;
        const regla = clave && tipoIE ? MINIMOS_RVM071.find(r => r.nivel === clave && r.tipo.test(tipoIE)) : null;
        const minimo = regla ? minPara(regla) : null;
        if (clave === "inicial") return inicialBloque(m);
        const grados = (m.detalle || []).filter(g => (Number(g.total) || 0) || (Number(g.secciones) || 0));
        const tarjetas = grados.map(g => {
          const sec = Number(g.secciones) || 0;
          const tot = Number(g.total) || 0;
          const fg = ((ie.criteriosFlexibles || {})[m.codigo]?.grados || {})[g.grado] || null;
          // Capacidad de s secciones: las secciones con criterio usan su mínimo; las demás, el parámetro normal.
          const capOf = s => (minimo == null ? null : (fg ? Number(fg.minimo) * Math.min(Number(fg.n), s) + minimo * (s - Math.min(Number(fg.n), s)) : minimo * s));
          const tol = tolPara(regla);
          let color, etiqueta, alcance = "", sugerencia = "";
          if (!tipoIE) { color = "gris"; etiqueta = "Gris: falta el tipo de IE"; }
          else if (!regla) { color = "gris"; etiqueta = "Gris: sin parámetro para este nivel"; }
          else if (!esRural && !esUrbana) { color = "gris"; etiqueta = "Gris: falta la zona"; }
          else if (minimo === null) { color = "gris"; etiqueta = "Gris: la tabla no aplica en zona urbana"; }
          else if (!sec) { color = "gris"; etiqueta = "Gris: falta el número de secciones"; }
          else {
            const dif = capOf(sec) - tot;
            if (dif === 0) { color = "verde"; etiqueta = "Verde: cumple"; }
            else if (dif < 0) {
              color = "amarillo"; etiqueta = "Amarillo: excede"; alcance = `sobran ${-dif}`;
              const cn = tot / (capOf(sec) / sec);
              if (Math.round(cn * 10) % 10 >= 5) sugerencia = `Sugerencia: aumentar de ${sec} a ${Math.ceil(cn)} secciones (${tot} ÷ ${(capOf(sec) / sec).toFixed(1).replace(".", ",")} = ${cn.toFixed(1).replace(".", ",")}, redondeado hacia arriba).`;
            }
            else if (dif <= tol) { color = "amarillo"; etiqueta = "Amarillo: necesita revisión"; alcance = `faltan ${dif}`; }
            else {
              // Un grado con una sola sección que no cumple queda en amarillo: no hay otra sección que ajustar.
              if (sec === 1) { color = "amarillo"; etiqueta = "Amarillo: una sección, no alcanza"; alcance = `faltan ${dif}`; }
              else { color = "rojo"; etiqueta = "Rojo: no cumple"; alcance = `faltan ${dif}`; }
              for (let s2 = sec - 1; s2 >= 1; s2--) {
                const d2 = capOf(s2) - tot;
                if (d2 === 0) { sugerencia = `Sugerencia: reducir de ${sec} a ${s2} secciones: cumple exactamente.`; break; }
                if (d2 >= 1 && d2 <= tol) { sugerencia = `Sugerencia: reducir de ${sec} a ${s2} secciones: quedaría en amarillo (faltarían ${d2}).`; break; }
                if (d2 <= -1 && d2 >= -tol) { sugerencia = `Sugerencia: reducir de ${sec} a ${s2} secciones: quedaría en amarillo (excedería ${-d2}).`; break; }
              }
            }
          }
          cuenta[color]++;
          resumenGrados.push({ nivel: m.nivel, grado: g.grado, color, alcance, sec, tot, minimo, tol, capacidad: minimo == null ? null : capOf(sec), flex: fg ? `${fg.n} de ${sec} secciones con ${fg.minimo}${fg.motivo ? " (" + fg.motivo + ")" : ""}` : "", sugerencia });
          return `<div class="rac-caja ${color}">
            <div class="rac-cab"><b>${esc(g.grado)}</b><span>${sec} sec. · ${tot} est.</span></div>
            <div class="rac-color">${esc(etiqueta)}</div>
            ${alcance ? `<div class="rac-alcance">${esc(alcance)}</div>` : ""}
            ${sec > 1 ? `<div class="rac-prom">Promedio por sección: <b>${(tot / sec).toFixed(1).replace(".", ",")}</b></div>` : ""}
            ${fg ? `<div class="rac-flex">Criterio flexible: <b>${esc(fg.n)} de ${sec} secciones</b> con <b>${esc(fg.minimo)}</b> estudiantes por sección${fg.motivo ? " (" + esc(fg.motivo) + ")" : ""}.</div>` : ""}
            ${sugerencia ? `<div class="rac-sug">${esc(sugerencia)}</div>` : ""}
          </div>`;
        }).join("");
        return `<h3 class="rac-nivel">${esc(m.nivel)} · código ${esc(m.codigo || "—")}</h3>
          ${tarjetas ? `<div class="rac-grid">${tarjetas}</div>` : `<p class="vacio">Sin detalle por grado para este nivel.</p>`}`;
      }).join("");
      ultimoResumenAnalisis = { cuenta, resumenGrados, tol };
      return `${cabeza}
        ${bloques}
        <p class="nota">Referencia: RVM 071-2024 (EBR). Verde: diferencia 0. Amarillo: sobran estudiantes, o faltan hasta la tolerancia (${tol}). Rojo: faltan más de ${tol}. Un grado con una sola sección que no alcanza queda en amarillo. Gris: falta un dato. La tolerancia la define la UGEL; puedes cambiarla arriba.</p>`;
    }

  // ---------- Descargas a Excel ----------
  // Excel según la parte de la ficha donde se pulsa: identificación, docentes, estudiantes o análisis.
  function excelSeccion(i, tipo) {
    const ie = todas[i];
    if (!ie) return;
    const sn = v => (v === undefined || v === null) ? "" : v;
    const base = "IE_" + String(ie.nombre || i).replace(/[^\w\-]+/g, "_").slice(0, 40);
    if (tipo === "identificacion") {
      const filas = [["Nombre", ie.nombre], ["Distrito", ie.distrito], ["Dirección", ie.direccion], ["Zona", ie.zona],
        ["Gestión", ie.gestion], ["Tipo de I.E.", ie.tipoIE], ["Condición", ie.condicion], ["Director", ie.director],
        ["Subdirector", ie.subdirector], ["Códigos modulares", (ie.matriculaPorNivel || []).map(m => m.codigo).filter(Boolean).join(" · ")],
        ["Estudiantes", sn(ie.estudiantes)], ["Latitud", sn(ie.latitud)], ["Longitud", sn(ie.longitud)]]
        .map(([campo, valor]) => ({ campo, valor: sn(valor) }));
      return excelDescargar(base + "_identificacion", [{ nombre: "Identificación", filas }]);
    }
    if (tipo === "docentes") {
      const pv = Array.isArray(personalVisible) ? personalVisible : [];
      const filas = pv.filter(p => ie.claveUGEL && p.claveUGEL === ie.claveUGEL).map(p => ({
        codigo_plaza: sn(p.codigoPlaza), codigo_personal: sn(p.codigoPersona), apellidos_nombres: sn(p.nombreCompleto),
        cargo: sn(p.cargo), tipo_trabajador: sn(p.tipoTrabajador), nivel: sn(p.nivelEducativo), modalidad: modalidadDe ? modalidadDe(p.nivelEducativo) : "",
        situacion: sn(p.situacionLaboral), categoria: sn(p.categoria), jornada: sn(p.jornada), regimen: sn(p.regimen)
      }));
      return excelDescargar(base + "_docentes", [{ nombre: "Docentes y personal", filas }]);
    }
    if (tipo === "estudiantes") {
      const niveles = [], matricula = [];
      (ie.matriculaPorNivel || []).forEach(m => {
        niveles.push({ nivel: sn(m.nivel), codigo: sn(m.codigo), matricula: sn(m.matricula), definitiva: sn(m.definitiva), en_proceso: sn(m.enProceso), grados: sn(m.grados) });
        (m.detalle || []).forEach(d => matricula.push({ nivel: sn(m.nivel), codigo: sn(m.codigo), grado_o_edad: sn(d.grado), secciones: sn(d.secciones), hombres: sn(d.hombres), mujeres: sn(d.mujeres), total: sn(d.total) }));
      });
      return excelDescargar(base + "_estudiantes", [{ nombre: "Totales por nivel", filas: niveles }, { nombre: "Estudiantes por grado", filas: matricula }]);
    }
    if (tipo === "analisis") {
      const r = resumenDeIE(i);
      const filas = r.grados.map(g => ({ nivel: g.nivel, grado: g.grado, resultado: g.color, alcance: g.alcance }));
      filas.push({ nivel: "TOTAL", grado: "", resultado: `Verde ${r.cuenta.verde} · Amarillo ${r.cuenta.amarillo} · Rojo ${r.cuenta.rojo} · Gris ${r.cuenta.gris}`, alcance: "" });
      return excelDescargar(base + "_analisis", [{ nombre: "Análisis por grado", filas }]);
    }
  }
  function excelDescargar(nombreArchivo, hojas) {
    if (typeof XLSX === "undefined") { aviso("No se cargó la librería de Excel. Recarga la página con Ctrl+F5."); return; }
    const wb = XLSX.utils.book_new();
    hojas.forEach(h => {
      const filas = h.filas.length ? h.filas : [{ aviso: "Sin datos" }];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(filas), h.nombre);
    });
    XLSX.writeFile(wb, `${nombreArchivo}_${new Date().toISOString().slice(0, 10)}.xlsx`);
  }
  // Ficha de una IE: identificación, matrícula, personal visible y análisis por grado.
  function fichaExcel(i) {
    const ie = todas[i];
    if (!ie) return;
    const sn = v => (v === undefined || v === null) ? "" : v;
    const ident = [
      ["Nombre", ie.nombre], ["Distrito", ie.distrito], ["Dirección", ie.direccion], ["Zona", ie.zona],
      ["Gestión", ie.gestion], ["Tipo de I.E.", ie.tipoIE], ["Condición", ie.condicion], ["Director", ie.director],
      ["Subdirector", ie.subdirector], ["Códigos modulares", (ie.matriculaPorNivel || []).map(m => m.codigo).filter(Boolean).join(" · ") || (ie.codigosModulares || []).join(" · ")],
      ["Estudiantes", sn(ie.estudiantes)], ["Docentes (ficha)", sn(ie.docentes)], ["Latitud", sn(ie.latitud)], ["Longitud", sn(ie.longitud)]
    ].map(([campo, valor]) => ({ campo, valor: sn(valor) }));
    const matricula = [];
    (ie.matriculaPorNivel || []).forEach(m => (m.detalle || []).forEach(d => matricula.push({
      nivel: sn(m.nivel), codigo: sn(m.codigo), grado_o_edad: sn(d.grado), secciones: sn(d.secciones),
      hombres: sn(d.hombres), mujeres: sn(d.mujeres), total: sn(d.total)
    })));
    const pers = (typeof personalVisible !== "undefined" ? personalVisible : []).filter(p => ie.claveUGEL && p.claveUGEL === ie.claveUGEL).map(p => ({
      codigo_plaza: sn(p.codigoPlaza), codigo_personal: sn(p.codigoPersona), apellidos_nombres: sn(p.nombreCompleto),
      cargo: sn(p.cargo), nivel: sn(p.nivelEducativo), situacion: sn(p.situacionLaboral), categoria: sn(p.categoria),
      jornada: sn(p.jornada), regimen: sn(p.regimen)
    }));
    const r = resumenDeIE(i);
    const analisis = r.grados.map(g => ({ nivel: g.nivel, grado: g.grado, resultado: g.color, alcance: g.alcance }));
    analisis.push({ nivel: "TOTAL", grado: "", resultado: `Verde ${r.cuenta.verde} · Amarillo ${r.cuenta.amarillo} · Rojo ${r.cuenta.rojo} · Gris ${r.cuenta.gris}`, alcance: "" });
    excelDescargar("IE_" + String(ie.nombre || i).replace(/[^\w\-]+/g, "_").slice(0, 40), [
      { nombre: "Identificación", filas: ident }, { nombre: "Matrícula por grado", filas: matricula },
      { nombre: "Personal visible", filas: pers }, { nombre: "Análisis", filas: analisis }
    ]);

  function personalGeneralExcel() {

      codigo_plaza: sn2(p.codigoPlaza), codigo_personal: sn2(p.codigoPersona), apellidos_nombres: sn2(p.nombreCompleto),
      cargo: sn2(p.cargo), situacion: sn2(p.situacionLaboral), categoria: sn2(p.categoria), jornada: sn2(p.jornada), regimen: sn2(p.regimen)
    })) }]);

  function sn2(v) { return (v === undefined || v === null) ? "" : v; }
  // ---------- Análisis general: resumen del análisis de todas las IE ----------
  // Usa la misma ficha de cada IE y toma su pestaña 6 (Resumen), para que los números coincidan con la ficha.
  function resumenDeIE(i) {
    const prevRac = estado.racNivel;
    estado.racNivel = null;
    let html = "";
    try { html = vistaFicha(i); } finally { estado.racNivel = prevRac; }
    const div = document.createElement("div");
    div.innerHTML = html;
    const colores = ["verde", "amarillo", "rojo", "gris"];
    const cuenta = { verde: 0, amarillo: 0, rojo: 0, gris: 0 };
    const grados = [];
    const sec6 = div.querySelectorAll(".cuadro")[5];
    if (sec6) {
      sec6.querySelectorAll(".rac-resumen-total .rac-pill").forEach(p => {
        const k = colores.find(c => p.classList.contains(c));
        if (k) cuenta[k] = Number((p.textContent.match(/\d+/) || [0])[0]);
      });
      sec6.querySelectorAll("tbody tr").forEach(tr => {
        const td = tr.querySelectorAll("td");
        if (td.length < 4) return;
        const pill = td[2].querySelector(".rac-pill");
        const color = (pill && colores.find(c => pill.classList.contains(c))) || "gris";
        grados.push({ nivel: td[0].textContent, grado: td[1].textContent, color, alcance: td[3].textContent });
      });
    }
    return { cuenta, grados };
  }
  // Agrupa los grados de una IE por nivel educativo (Inicial, Primaria, Secundaria).
  function nivelSimpleAG(n) {
    const u = sinTildes(n || "");

      resumen.push({ institucion: xlsValor(x.ie.nombre), distrito: xlsValor(x.ie.distrito), codigo: xlsValor(x.ie.codigo), verde: r.cuenta.verde, amarillo: r.cuenta.amarillo, rojo: r.cuenta.rojo, gris: r.cuenta.gris, grados: r.grados.length, niveles: porNivelAG(r.grados).map(n => `${n.nivel}: V${n.verde} A${n.amarillo} R${n.rojo} G${n.gris}`).join(" | ") });
      analisisFilasIE(x.ie, x.i).forEach(f => detalle.push({ institucion: xlsValor(x.ie.nombre), distrito: xlsValor(x.ie.distrito), ...f }));
      matriculaFormatoUGEL(x.ie).forEach(f => { if (f.distrito !== "TOTAL") matricula.push(f); });
    });
    excelDescargar("Analisis_general", [
      { nombre: "Resumen por IE", titulo: "Resumen del análisis por institución", filas: resumen },
      { nombre: "Detalle por grado", titulo: "Análisis por grado de todas las instituciones", filas: detalle },
      { nombre: "Matrícula formato UGEL", titulo: "Matrícula de todas las instituciones (formato UGEL)", filas: matricula }
    ]);
  }
  function pintar() {
    const v = estado.pila[estado.pila.length - 1];
    const portadaEl = document.getElementById("portada");
    if (portadaEl) portadaEl.style.display = (v.tipo === "home" || v.tipo === "distrito" || v.tipo === "mapa") ? "" : "none";
    if (mapaLeaflet && v.tipo !== "mapa") { mapaLeaflet.remove(); mapaLeaflet = null; marcadoresMapa = {}; }
    if (v.tipo === "home") app.innerHTML = vistaHome();
    else if (v.tipo === "distrito") app.innerHTML = vistaDistrito(v.clave);
    else if (v.tipo === "mapa") { app.innerHTML = vistaMapa(); iniciarMapa(); }
    else if (v.tipo === "personal") app.innerHTML = vistaPersonalGeneral();
    else if (v.tipo === "analisisGeneral") app.innerHTML = vistaAnalisisGeneral();
    else app.innerHTML = vistaFicha(v.i);
    if (v.tipo === "home") pintarResultados();
    if (v.tipo === "distrito") pintarGruposDistrito();
    window.scrollTo(0, 0);
  }

  function ir(vista) {
    estado.pila.push(vista);
    estado.foto = 0;
    if (vista.tipo === "distrito") estado.dq = "";
    pintar();
  }

  function volver() {
    if (estado.pila.length > 1) estado.pila.pop();
    estado.foto = 0;
    pintar();
  }
